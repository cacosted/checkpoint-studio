[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-checkpoint-studio"
version = "1.0.0"
description = "Convierte guiones de Notion en checkpoints y plantillas de equipo"
requires-python = ">=3.9"
dependencies = ["PyMuPDF>=1.24,<2"]

[project.scripts]
checkpoint-studio = "checkpoint_studio.__main__:main"

[tool.setuptools.packages.find]
include = ["checkpoint_studio*"]

[tool.setuptools.package-data]
checkpoint_studio = ["static/*", "static/data/*"]
